name: hml_lidar_reva

services:
  ros2_processing:
    container_name: hml_lidar_reva
    image: hml-lidar-reva:local

    build:
      context: .
      dockerfile: Dockerfile

    # RevA field-processing environment was validated on amd64.
    # On Apple Silicon, Docker Desktop will run this image through emulation.
    platform: linux/amd64

    # Keep the processing container alive so that the HML scripts can use
    # `docker exec` to start ROS 2, DLIO, rosbag replay and conversion tools.
    command: ["sleep", "infinity"]

    stdin_open: true
    tty: true
    init: true

    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"

    # ROS 2 nodes used for post-processing run inside the same container.
    # Port 9090 is exposed for rosbridge/Foxglove-compatible visualization.
    ports:
      - "${HML_ROSBRIDGE_PORT:-9090}:9090"

    volumes:
      # Raw ROS 2 bags. Override HML_RAW_DIR in the shell or in a .env file
      # when the expedition data are stored elsewhere.
      - "${HML_RAW_DIR:-./raw}:/root/data"

      # Persistent processing outputs.
      - "${HML_RESULTS_DIR:-./results}:/root/ros2_ws/results"

      # RevA configuration files are mounted read-only.
      - "../../configuration:/root/hml/config:ro"

      # Processing scripts are mounted read-only. They remain editable on the
      # host while the container always sees the current RevA scripts.
      - ".:/root/hml/scripts:ro"

    working_dir: /root/ros2_ws
