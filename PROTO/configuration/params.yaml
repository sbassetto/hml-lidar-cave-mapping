###############################################################################
# HML-LiDAR RevA — FIELD-TESTED DLIO CONFIGURATION
# ---------------------------------------------------------------------------
# This file records the parameter values actually used for the RevA field
# acquisitions. Numerical values are intentionally preserved as used during
# the reported cave surveys.
#
# Distances: metres (m)
# Angles: degrees (deg), where applicable in DLIO
# Time: seconds (s)
#
# The comments below describe the operational role of each parameter. They do
# not claim that the RevA values are globally optimal for cave environments.
###############################################################################

# --- GENERAL CONFIGURATION AND TOPICS ---
# use_sim_time:
#   true when replaying recorded ROS2 bags using /clock.
# pointcloud_topic / imu_topic:
#   Raw Livox Mid-360 LiDAR and IMU streams used by DLIO.

# --- MAPPING ---
# map/waitUntilMove:
#   If true, mapping waits until motion is detected.
# map/dense/filtered:
#   Enables filtering of the dense map output.
# map/sparse/leafSize:
#   Voxel leaf size used for the sparse map representation.

# --- IMU AND GRAVITY ---
# odom/gravity:
#   Magnitude of gravitational acceleration in m/s^2.
# odom/computeTimeOffset:
#   Enables estimation of timing offset when supported by the DLIO workflow.
# odom/imu/approximateGravity:
#   Enables gravity approximation during IMU processing.
# odom/imu/calibration/gyro and accel:
#   Enable initial calibration of gyroscope and accelerometer biases.
# odom/imu/calibration/time:
#   Initial stationary calibration duration. The HML-LiDAR should remain
#   motionless during this period.
# odom/imu/bufferSize:
#   Number of IMU messages retained for synchronization and processing.

# --- PREPROCESSING ---
# odom/preprocessing/cropBoxFilter/size:
#   Removes returns very close to the sensor, including potential mount or
#   helmet-related returns.
# odom/preprocessing/voxelFilter/res:
#   Voxel-filter resolution used to reduce point-cloud density before
#   odometry processing.

# --- KEYFRAMES ---
# odom/keyframe/threshD:
#   Translation threshold for creating a new keyframe.
# odom/keyframe/threshR:
#   Rotation threshold for creating a new keyframe.
#   The RevA value below is the value actually used during field acquisition
#   and post-processing.

# --- GICP ---
# odom/gicp/minNumPoints:
#   Minimum number of points required for registration.
# odom/gicp/kCorrespondences:
#   Number of neighbours used in correspondence estimation.
# odom/gicp/maxCorrespondenceDistance:
#   Maximum correspondence search distance.
# odom/gicp/maxIterations:
#   Maximum number of registration iterations.
# odom/gicp/transformationEpsilon and rotationEpsilon:
#   Convergence thresholds for translation and rotation.
# odom/gicp/initLambdaFactor:
#   Initial regularization / damping factor used by the optimizer.

# --- SUBMAPS ---
# odom/submap/keyframe/knn / kcv / kcc:
#   Numbers of neighbouring keyframes used by the local submap construction.

# --- GEOMETRIC OBSERVER ---
# Kp:
#   Position correction gain.
# Kv:
#   Velocity correction gain.
# Kq:
#   Attitude correction gain.
# Kab / Kgb:
#   Accelerometer- and gyroscope-bias correction gains.
# abias_max / gbias_max:
#   Maximum permitted accelerometer and gyroscope bias corrections.
###############################################################################

/**:
  ros__parameters:

    # --- General configuration ---
    use_sim_time: true
    pointcloud_topic: "/livox/lidar"
    imu_topic: "/livox/imu"

    # --- Frames ---
    frames/odom: "odom"
    frames/baselink: "base_link"
    frames/lidar: "lidar"
    frames/imu: "imu"

    # --- Mapping ---
    map/waitUntilMove: false
    map/dense/filtered: true
    map/sparse/leafSize: 0.1

    # --- IMU and gravity ---
    odom/gravity: 9.80665
    odom/computeTimeOffset: true
    odom/imu/approximateGravity: true
    odom/imu/calibration/gyro: true
    odom/imu/calibration/accel: true
    odom/imu/calibration/time: 5.0
    odom/imu/bufferSize: 5000

    # --- Preprocessing ---
    odom/preprocessing/cropBoxFilter/size: 0.5
    odom/preprocessing/voxelFilter/res: 0.1

    # --- Keyframes ---
    odom/keyframe/threshD: 1.0
    odom/keyframe/threshR: 1.0

    # --- GICP ---
    odom/gicp/minNumPoints: 100
    odom/gicp/kCorrespondences: 20
    odom/gicp/maxCorrespondenceDistance: 1.0
    odom/gicp/maxIterations: 100
    odom/gicp/transformationEpsilon: 0.001
    odom/gicp/rotationEpsilon: 0.0001
    odom/gicp/initLambdaFactor: 1e-9

    # --- Submaps ---
    odom/submap/keyframe/knn: 50
    odom/submap/keyframe/kcv: 50
    odom/submap/keyframe/kcc: 50

    # --- Geometric observer ---
    odom/geo/Kp: 4.0
    odom/geo/Kv: 2.0
    odom/geo/Kq: 2.0
    odom/geo/Kab: 1.0
    odom/geo/Kgb: 1.0
    odom/geo/abias_max: 4.0
    odom/geo/gbias_max: 0.5
